name: fork-ci

# 本机没有 MSVC（pnpm dev / 打包跑不起来），所以 build 与 e2e 的门禁放在这里。
#
# 三个 job：
#   verify      —— 快闸门（约 2 分钟）：typecheck + build + 骨架/挂载面积自检。每次 push 都跑。
#   e2e-smoke   —— 7 个用例的冒烟子集，验证「真实 Electron 在 CI 里能起来并点得动」。
#   e2e-full    —— 95 个用例全量，只在每天定时 / 手动触发；单次实测超过 15 分钟。
on:
  push:
    branches:
      - fork
  pull_request:
  workflow_dispatch:
  schedule:
    # 每天 18:00 UTC（= 北京 02:00）跑一次全量 e2e，跑在默认分支 fork 上
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 挂载面积检查要拿上游 tag 做基准，所以需要完整历史 + tag
          fetch-depth: 0

      - name: Read fork.config.json
        id: cfg
        shell: bash
        run: |
          echo "node=$(node -p "require('./fork.config.json').ci.nodeVersion")" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(node -p "require('./fork.config.json').ci.pnpmVersion")" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.cfg.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.cfg.outputs.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch upstream tags (baseline for the mount-footprint check)
        shell: bash
        run: |
          UP_OWNER=$(node -p "require('./fork.config.json').upstream.owner")
          UP_REPO=$(node -p "require('./fork.config.json').upstream.repo")
          git remote add upstream "https://github.com/${UP_OWNER}/${UP_REPO}.git" || true
          git fetch upstream --tags --prune || echo "::warning::upstream fetch 失败，跳过挂载面积检查"

      - name: Fork scaffolding checks
        shell: bash
        run: bash fork/tools/check-integration.sh

      - name: Typecheck + build
        run: pnpm build

      - name: Update metadata self-check (version ordering)
        # 用真实 electron-updater 判定逻辑，确认「日期更早的版本可升级、同版本不升级、更晚的版本不降级」
        run: |
          node fork/tools/check-update-logic.mjs --version 1.24.0-fork.20260101.1 --self-check --current 1.24.0-fork.20251231.1

  # 冒烟子集：7 个用例。挑的是「应用能起来 + 侧栏能切 + 设置能开 + 技能列表能读」这类
  # 一旦坏就不可能正常使用的路径；拿它当 push 门禁候选（先观察，绿了再去掉 continue-on-error）。
  e2e-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read fork.config.json
        id: cfg
        shell: bash
        run: |
          echo "node=$(node -p "require('./fork.config.json').ci.nodeVersion")" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(node -p "require('./fork.config.json').ci.pnpmVersion")" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.cfg.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.cfg.outputs.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (e2e drives the real app out of out/)
        run: pnpm build

      - name: e2e smoke subset
        run: |
          node node_modules/electron/install.js
          pnpm test:e2e:only -- tests/e2e/smoke.spec.ts tests/e2e/navigation.spec.ts tests/e2e/settings.spec.ts tests/e2e/skills.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  # 全量 95 个用例：耗时以十分钟计，只在定时 / 手动触发，避免每次 push 都烧 25 分钟 runner。
  e2e-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read fork.config.json
        id: cfg
        shell: bash
        run: |
          echo "node=$(node -p "require('./fork.config.json').ci.nodeVersion")" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(node -p "require('./fork.config.json').ci.pnpmVersion")" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.cfg.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.cfg.outputs.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (e2e drives the real app out of out/)
        run: pnpm build

      - name: e2e full suite
        run: |
          node node_modules/electron/install.js
          pnpm test:e2e:only

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
