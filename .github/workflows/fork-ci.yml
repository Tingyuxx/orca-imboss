name: fork-ci

# 本机没有 MSVC（pnpm dev / 打包跑不起来），所以 build 与 e2e 的门禁放在这里。
on:
  push:
    branches:
      - fork
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 挂载面积检查要拿上游 tag 做基准，所以需要完整历史 + tag
          fetch-depth: 0

      - name: Read fork.config.json
        id: cfg
        shell: bash
        run: |
          echo "node=$(node -p "require('./fork.config.json').ci.nodeVersion")" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(node -p "require('./fork.config.json').ci.pnpmVersion")" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.cfg.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.cfg.outputs.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch upstream tags (baseline for the mount-footprint check)
        shell: bash
        run: |
          UP_OWNER=$(node -p "require('./fork.config.json').upstream.owner")
          UP_REPO=$(node -p "require('./fork.config.json').upstream.repo")
          git remote add upstream "https://github.com/${UP_OWNER}/${UP_REPO}.git" || true
          git fetch upstream --tags --prune || echo "::warning::upstream fetch 失败，跳过挂载面积检查"

      - name: Fork scaffolding checks
        shell: bash
        run: bash fork/tools/check-integration.sh

      - name: Typecheck + build
        run: pnpm build

  # e2e 单独一个 job，与 verify 并行：verify 2 分钟内就给出可用/不可用的结论，
  # 不让 95 个 Playwright 用例（串行、每个 30s 超时上限）拖住整条流水线。
  e2e:
    runs-on: windows-latest
    # 实测：单次运行超过 13 分钟仍未结束（run 44480057467）。先给 25 分钟上限，跑通后再冻结耗时。
    timeout-minutes: 25
    # 拿不到一次完整通过之前只作为「参考信号」：失败不上红叉，但报告会留存，
    # 这样 fork 主干可以靠 verify 门禁保持可用，同时 e2e 的坑还能被看见。
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read fork.config.json
        id: cfg
        shell: bash
        run: |
          echo "node=$(node -p "require('./fork.config.json').ci.nodeVersion")" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(node -p "require('./fork.config.json').ci.pnpmVersion")" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.cfg.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.cfg.outputs.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (e2e drives the real app out of out/)
        run: pnpm build

      - name: e2e (Playwright)
        run: |
          node node_modules/electron/install.js
          pnpm test:e2e:only

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
