name: fork-ci

# 本机没有 MSVC（pnpm dev / 打包跑不起来），所以 build 与 e2e 的门禁放在这里。
on:
  push:
    branches:
      - fork
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    # 95 个 e2e 用例 × 30s 超时上限 ≈ 最坏 55 分钟；不设上限会白烧 runner 配额。
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 挂载面积检查要拿上游 tag 做基准，所以需要完整历史 + tag
          fetch-depth: 0

      - name: Read fork.config.json
        id: cfg
        shell: bash
        run: |
          echo "node=$(node -p "require('./fork.config.json').ci.nodeVersion")" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(node -p "require('./fork.config.json').ci.pnpmVersion")" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.cfg.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.cfg.outputs.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch upstream tags (baseline for the mount-footprint check)
        shell: bash
        run: |
          UP_OWNER=$(node -p "require('./fork.config.json').upstream.owner")
          UP_REPO=$(node -p "require('./fork.config.json').upstream.repo")
          git remote add upstream "https://github.com/${UP_OWNER}/${UP_REPO}.git" || true
          git fetch upstream --tags --prune || echo "::warning::upstream fetch 失败，跳过挂载面积检查"

      - name: Fork scaffolding checks
        shell: bash
        run: bash fork/tools/check-integration.sh

      - name: Typecheck + build
        run: pnpm build

      - name: e2e (Playwright)
        # 实测（run 44480057467）：95 个用例串行跑，耗时显著长于上游注释里说的「一分钟」。
        # 在拿到一次完整通过之前保持 continue-on-error，避免它挡住真正的门禁（typecheck+build+脚手架自检）。
        continue-on-error: true
        timeout-minutes: 35
        run: |
          node node_modules/electron/install.js
          pnpm test:e2e:only

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
