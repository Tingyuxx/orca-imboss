name: fork-release

# 触发方式：
#  1) 推一个 fork 版本 tag（推荐，用 bash fork/tools/release.sh 生成）：
#       v1.24.0-fork.20261119.1
#  2) 手动 workflow_dispatch，填 version（如 1.24.0-fork.20261119.1）。
#     tag 由 CI 自己创建并推送（打包阶段用 --publish never，electron-builder 不再代劳打 tag）。
#
# 版本/tag 规则只认 <官方版本>-fork.<YYYYMMDD>.<序号>：
#   * 合法 semver —— electron-updater 的 GitHub provider 会跳过非法 semver 的 tag；
#   * 预发布标识 fork —— 决定更新通道（fork.yml）并让 allowPrerelease 自动为 true；
#   * 日期 + 序号 —— 严格单调递增（同一天发两次就是 .1 / .2）。
on:
  push:
    tags:
      - "v*-fork.*"
  workflow_dispatch:
    inputs:
      version:
        description: "fork 版本号，例如 1.24.0-fork.20261119.1"
        required: true

# 只用 Actions 自带的 GITHUB_TOKEN，不需要任何自定义 secret。
permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read fork.config.json
        id: cfg
        shell: bash
        run: |
          echo "node=$(node -p "require('./fork.config.json').ci.nodeVersion")" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(node -p "require('./fork.config.json').ci.pnpmVersion")" >> "$GITHUB_OUTPUT"
          echo "artifact=$(node -p "require('./fork.config.json').artifactBaseName")" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.cfg.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.cfg.outputs.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本: $VERSION / tag: $TAG"

      - name: Patch package.json version (never committed)
        shell: bash
        run: node fork/tools/set-version.mjs "${{ steps.ver.outputs.version }}" --strict-base

      - name: Generate electron-builder config from fork.config.json
        run: node fork/tools/gen-builder-config.mjs

      - name: Fork scaffolding checks
        shell: bash
        run: |
          UP_OWNER=$(node -p "require('./fork.config.json').upstream.owner")
          UP_REPO=$(node -p "require('./fork.config.json').upstream.repo")
          git remote add upstream "https://github.com/${UP_OWNER}/${UP_REPO}.git" || true
          git fetch upstream --tags --prune || true
          bash fork/tools/check-integration.sh

      - name: Typecheck + build
        run: pnpm build

      - name: Package (no publisher)
        # 刻意用 --publish never：electron-builder 26.17.0 在 --publish always 下会为同一条 tag
        # 并发创建**两个** release（实测 .1/.4 各出现一个「兄弟」 release，blockmap 被传到了另一个上，
        # 于是 PATCH 改标题/正文永远 422 tag_name already exists）。发布动作改由下面的
        # 「Publish release」步骤用 gh 一次性完成，可重入、可复现。
        run: pnpm exec electron-builder --win --config .electron-builder.fork.gen.yml --publish never

      - name: Publish release (single, deterministic)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          ART="${{ steps.cfg.outputs.artifact }}"
          BASE_TAG=$(node -p "require('./fork/upstream-base.json').baseTag")
          BASE_COMMIT=$(node -p "require('./fork/upstream-base.json').baseCommit")
          UP_OWNER=$(node -p "require('./fork.config.json').upstream.owner")
          UP_REPO=$(node -p "require('./fork.config.json').upstream.repo")

          INSTALLER="dist/${ART}-${VERSION}.exe"
          BLOCKMAP="${INSTALLER}.blockmap"
          LATEST="dist/latest.yml"
          for f in "$INSTALLER" "$LATEST"; do
            [ -f "$f" ] || { echo "::error::缺少发布产物 $f"; exit 1; }
          done
          FILES=("$INSTALLER" "$LATEST")
          [ -f "$BLOCKMAP" ] && FILES+=("$BLOCKMAP") || echo "::warning::没有 blockmap，本次更新只能全量下载"

          NOTES="Fork build based on upstream ${BASE_TAG} (\`${BASE_COMMIT:0:8}\`).
          Upstream: https://github.com/${UP_OWNER}/${UP_REPO}/tree/${BASE_COMMIT}

          版本号规则：<官方版本>-fork.<发布日>.<当日序号>，据此自动更新可从上一个 fork 版本升级。
          安装包未签名，首次安装时 Windows SmartScreen 会提示一次。"

          # 手动触发时 tag 可能还不存在（push tag 触发时一定存在）——自己补上，保证 --verify-tag 可用。
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "远端没有 ${TAG}，由 CI 创建并推送"
            git tag -a "$TAG" -m "fork release ${TAG}" -m "upstream base: ${BASE_TAG} (${BASE_COMMIT})"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release 已存在，改为补传资产（可重入）"
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "imboss-fork ${VERSION}"
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "${FILES[@]}" --repo "${{ github.repository }}"               --verify-tag --title "imboss-fork ${VERSION}" --notes "$NOTES"
          fi
          # 正文单独再 PATCH 一次：create 时带 notes 在部分 gh 版本上会被忽略
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes "$NOTES"
          gh release view "$TAG" --repo "${{ github.repository }}" --json name,body,assets             -q '"name=\(.name)  assets=" + (.assets | map(.name) | join(", ")) + "  body=" + (.body | length | tostring) + " chars"'

      - name: Verify published update metadata
        # 门禁：latest.yml 里的 version 必须等于 tag 版本，且更新器判定逻辑自洽（可升级/不降级）。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release download "${{ steps.ver.outputs.tag }}" --repo "${{ github.repository }}" \
            --pattern latest.yml --dir .verify --clobber
          node fork/tools/check-update-logic.mjs \
            --latest-yml .verify/latest.yml \
            --expect-version "${{ steps.ver.outputs.version }}" \
            --self-check

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.artifact }}-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
